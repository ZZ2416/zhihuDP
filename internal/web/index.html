<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>zhihuDP · 知乎股票情绪分析</title>
<style>
  /* ===== 知乎看山风格设计系统（明暗双主题） ===== */
  :root {
    --bg: #f6f8fb; --bg-grad-a: #eaf3ff; --bg-grad-b: #f6f8fb;
    --card: #ffffff; --card-soft: #f2f6fc;
    --border: #e4e9f2; --shadow: 0 2px 12px rgba(0,30,80,.06);
    --text: #1f2329; --sub: #7d8aa0; --faint: #a8b3c5;
    --accent: #0084FF; --accent-weak: #e8f3ff; --accent-deep: #0066cc;
    --bull: #f5222d; --bull-bg: #fff1f0;
    --bear: #389e0d; --bear-bg: #f6ffed;
    --neutral: #86909c; --neutral-bg: #f0f2f5;
    --warn-bg: #fffbe6; --warn-border: #ffe58f; --warn-text: #874d00;
    --err-bg: #fff1f0; --err-border: #ffa39e; --err-text: #cf1322;
  }
  [data-theme="dark"] {
    --bg: #101418; --bg-grad-a: #131c28; --bg-grad-b: #101418;
    --card: #1b2129; --card-soft: #202934;
    --border: #2d3742; --shadow: 0 2px 14px rgba(0,0,0,.4);
    --text: #e8edf3; --sub: #8b99a8; --faint: #5c6b7a;
    --accent: #4d9fff; --accent-weak: #1c2f45; --accent-deep: #6db1ff;
    --bull: #ff6b75; --bull-bg: #3a2226;
    --bear: #5fca3c; --bear-bg: #1d2e1a;
    --neutral: #8b99a8; --neutral-bg: #262e38;
    --warn-bg: #332c14; --warn-border: #6b5b1e; --warn-text: #e8c468;
    --err-bg: #3a2020; --err-border: #6b2c2c; --err-text: #ff8f85;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Helvetica Neue", sans-serif;
    background: linear-gradient(180deg, var(--bg-grad-a) 0, var(--bg-grad-b) 260px);
    background-color: var(--bg); color: var(--text);
    min-height: 100vh; transition: background .3s, color .3s;
  }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }

  /* ===== 顶栏 ===== */
  header {
    position: sticky; top: 0; z-index: 50;
    display: flex; align-items: center; justify-content: space-between;
    max-width: 920px; margin: 0 auto; padding: 14px 20px;
    background: color-mix(in srgb, var(--bg) 82%, transparent);
    backdrop-filter: blur(10px);
  }
  .logo { display: flex; align-items: center; gap: 10px; font-size: 20px; font-weight: 700; }
  .logo .whale { width: 34px; height: 30px; }
  .header-right { display: flex; align-items: center; gap: 14px; }
  .tag { font-size: 12px; color: var(--sub); }
  #theme-btn {
    width: 36px; height: 36px; border-radius: 50%; border: 1px solid var(--border);
    background: var(--card); color: var(--text); font-size: 17px; cursor: pointer;
    display: flex; align-items: center; justify-content: center; transition: transform .2s;
  }
  #theme-btn:hover { transform: scale(1.08); }

  /* ===== 布局 ===== */
  .wrap { max-width: 880px; margin: 0 auto; padding: 12px 16px 40px; }

  /* ===== 搜索视图 ===== */
  .hero { text-align: center; padding: 46px 0 26px; }
  .hero .big-whale { width: 110px; height: 96px; margin: 0 auto 14px; animation: float 4s ease-in-out infinite; }
  @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-8px); } }
  .hero h2 { font-size: 26px; margin-bottom: 8px; }
  .hero p { color: var(--sub); font-size: 14px; }

  .search-card { padding: 24px; }
  .search { display: flex; gap: 10px; position: relative; }
  .search input {
    flex: 1; padding: 12px 16px; font-size: 15px; border: 1.5px solid var(--border);
    border-radius: 10px; outline: none; background: var(--card); color: var(--text); transition: border-color .2s, box-shadow .2s;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-weak); }
  .search button {
    padding: 0 28px; font-size: 15px; font-weight: 600; background: var(--accent); color: #fff;
    border: none; border-radius: 10px; cursor: pointer; transition: background .2s, transform .1s;
  }
  .search button:hover { background: var(--accent-deep); }
  .search button:active { transform: scale(.97); }
  .search button:disabled { opacity: .55; cursor: not-allowed; }

  .suggest { margin-top: 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--card); overflow: hidden; }
  .suggest-item { padding: 10px 16px; display: flex; align-items: center; gap: 10px; cursor: pointer; font-size: 14px; }
  .suggest-item:hover { background: var(--card-soft); }
  .suggest-item .code { color: var(--sub); font-size: 12px; }
  .suggest-item .market { font-size: 11px; background: var(--accent-weak); color: var(--accent); padding: 1px 8px; border-radius: 10px; margin-left: auto; }

  .hint { margin-top: 14px; font-size: 12px; color: var(--faint); text-align: center; }

  /* ===== 卡片 ===== */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 20px; margin-bottom: 14px; box-shadow: var(--shadow); }
  .view { animation: fadeUp .35s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

  .back { display: inline-block; margin: 6px 0 14px; font-size: 13px; color: var(--sub); cursor: pointer; }
  .back:hover { color: var(--accent); }

  .stock-head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .stock-head .name { font-size: 22px; font-weight: 700; }
  .stock-head .code { color: var(--sub); font-size: 14px; font-family: ui-monospace, Menlo, monospace; }
  .stock-head .market { font-size: 12px; background: var(--accent-weak); color: var(--accent); padding: 2px 10px; border-radius: 12px; }
  .stock-head .fresh { margin-left: auto; font-size: 12px; color: var(--faint); }

  /* 实时行情 */
  .q-row { display: flex; flex-direction: column; gap: 10px; }
  .q-price { font-size: 30px; font-weight: 800; }
  .q-change { margin-left: 10px; font-size: 15px; font-weight: 600; }
  .q-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 2px; }
  .q-cell { background: var(--card-soft); border-radius: 8px; padding: 8px 10px; }
  .q-cell .k { font-size: 11px; color: var(--faint); }
  .q-cell .v { font-size: 13px; font-weight: 600; margin-top: 2px; }
  @media (max-width: 560px) { .q-grid { grid-template-columns: repeat(3, 1fr); } }

  .section-title { font-size: 15px; font-weight: 700; margin-bottom: 14px; display: flex; align-items: center; gap: 8px; }
  .section-title::before { content: ""; width: 4px; height: 15px; border-radius: 2px; background: var(--accent); }

  /* 情绪面板 */
  .degraded { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); padding: 12px 16px; border-radius: 10px; font-size: 13px; margin-bottom: 14px; }
  .heat { display: flex; align-items: baseline; gap: 8px; margin-bottom: 16px; }
  .heat .num { font-size: 30px; font-weight: 800; color: var(--accent); }
  .heat .label { color: var(--sub); font-size: 13px; }
  .heat .sample { margin-left: auto; font-size: 12px; color: var(--faint); }
  .ratio-row { display: flex; align-items: center; gap: 10px; margin-bottom: 9px; }
  .ratio-row .rlabel { width: 60px; font-size: 13px; color: var(--sub); }
  .bar { flex: 1; height: 12px; background: var(--card-soft); border-radius: 6px; overflow: hidden; }
  .bar > div { height: 100%; border-radius: 6px; transition: width .6s ease; }
  .bull { background: var(--bull); } .bear { background: var(--bear); } .neutral { background: var(--neutral); }
  .ratio-row .rpct { width: 50px; text-align: right; font-size: 13px; font-weight: 600; }

  .score-box { display: flex; align-items: center; gap: 16px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--border); }
  .score-num { font-size: 38px; font-weight: 800; line-height: 1; }
  .score-num.low { color: var(--neutral); } .score-num.mid { color: #d4a017; } .score-num.high { color: var(--bull); }
  [data-theme="dark"] .score-num.mid { color: #e8c468; }
  .score-note { font-size: 12px; color: var(--faint); line-height: 1.6; }

  .items { margin-top: 16px; }
  .item { padding: 13px 2px; border-top: 1px solid var(--border); }
  .item:first-child { border-top: none; }
  .item .title-line { display: flex; align-items: center; gap: 8px; }
  .item a { font-size: 14px; font-weight: 600; color: var(--text); }
  .item a:hover { color: var(--accent); text-decoration: none; }
  .tag-sentiment { font-size: 11px; padding: 1px 9px; border-radius: 10px; white-space: nowrap; }
  .tag-sentiment.bull { color: var(--bull); background: var(--bull-bg); }
  .tag-sentiment.bear { color: var(--bear); background: var(--bear-bg); }
  .tag-sentiment.neutral { color: var(--neutral); background: var(--neutral-bg); }
  .item .meta { margin-top: 5px; font-size: 12px; color: var(--faint); display: flex; gap: 14px; }
  .item .excerpt { margin-top: 5px; font-size: 12px; color: var(--sub); line-height: 1.6; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

  /* AI 分析（markdown 渲染） */
  #analysis { font-size: 14px; line-height: 1.85; min-height: 40px; }
  #analysis h1, #analysis h2, #analysis h3 { margin: 14px 0 6px; line-height: 1.4; }
  #analysis h1 { font-size: 17px; } #analysis h2 { font-size: 16px; } #analysis h3 { font-size: 15px; }
  #analysis p { margin: 6px 0; }
  #analysis ul { margin: 6px 0 6px 20px; }
  #analysis li { margin: 4px 0; }
  #analysis hr { border: none; border-top: 1px dashed var(--border); margin: 12px 0; }
  #analysis strong { color: var(--accent-deep); }
  #analysis a { word-break: break-all; }
  #analysis code { background: var(--card-soft); padding: 1px 6px; border-radius: 4px; font-size: 12px; }
  .blink { display: inline-block; width: 8px; height: 16px; background: var(--accent); animation: blink 1s infinite; vertical-align: -2px; margin-left: 2px; }
  @keyframes blink { 50% { opacity: 0; } }

  .err-box { background: var(--err-bg); border: 1px solid var(--err-border); color: var(--err-text); padding: 14px 18px; border-radius: 12px; font-size: 13px; }
  .err-box .detail { margin-top: 6px; font-size: 12px; color: var(--sub); word-break: break-all; }

  /* ===== 页脚 ===== */
  footer { max-width: 880px; margin: 26px auto 40px; padding: 0 16px; text-align: center; font-size: 12px; color: var(--faint); }
  .foot-links { display: flex; justify-content: center; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; font-size: 13px; }
  .foot-links a { color: var(--sub); }
  .foot-links a:hover { color: var(--accent); text-decoration: none; }
  .foot-links .dot { color: var(--faint); }
  footer p { margin: 3px 0; }

  .hidden { display: none !important; }

  @media (max-width: 560px) {
    .hero { padding-top: 26px; } .hero h2 { font-size: 21px; }
    .tag { display: none; }
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <svg class="whale" viewBox="0 0 64 48" aria-hidden="true">
      <path d="M10 24 C4 16 2 10 4 6 c6 4 9 10 9 16z" fill="var(--accent)"/>
      <path d="M10 24 C4 32 2 38 4 42 c6-4 9-10 9-16z" fill="var(--accent)"/>
      <path d="M14 22 c0-8 7-14 16-14 h12 c10 0 18 6 18 14 c0 8-8 14-18 14 h-12 c-9 0-16-6-16-14z" fill="var(--accent)"/>
      <circle cx="34" cy="18" r="2.6" fill="#fff"/>
      <path d="M30 25 c2 2 5 2 7 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
      <path d="M22 8 c-2-3-6-4-8-3 M24 7 c-1-4-4-6-8-6 M26 9 c0-5-4-8-9-8" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
    </svg>
    <span>zhihuDP</span>
  </div>
  <div class="header-right">
    <span class="tag">知乎股票情绪分析 · 信息工具</span>
    <button id="theme-btn" title="切换明暗主题" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main class="wrap">

  <!-- 搜索视图 -->
  <section id="view-search" class="view">
    <div class="hero">
      <svg class="big-whale" viewBox="0 0 64 48" aria-hidden="true">
        <path d="M10 24 C4 16 2 10 4 6 c6 4 9 10 9 16z" fill="var(--accent)"/>
        <path d="M10 24 C4 32 2 38 4 42 c6-4 9-10 9-16z" fill="var(--accent)"/>
        <path d="M14 22 c0-8 7-14 16-14 h12 c10 0 18 6 18 14 c0 8-8 14-18 14 h-12 c-9 0-16-6-16-14z" fill="var(--accent)"/>
        <path d="M34 18 c2.5-1 5-1.5 7.5-1.5" stroke="#fff" stroke-width="1.4" fill="none" stroke-linecap="round"/>
        <circle cx="27" cy="17" r="2.6" fill="#fff"/>
        <path d="M23 24 c2 2 5 2 7 0" stroke="#fff" stroke-width="1.6" fill="none" stroke-linecap="round"/>
        <path d="M22 8 c-2-3-6-4-8-3 M24 7 c-1-4-4-6-8-6 M26 9 c0-5-4-8-9-8" stroke="var(--accent)" stroke-width="2" fill="none" stroke-linecap="round"/>
      </svg>
      <h2>看看知乎上大家在聊什么</h2>
      <p>输入股票名称或代码，查看讨论热度、多空情绪与 AI 解读</p>
    </div>
    <div class="card search-card">
      <div class="search">
        <input id="stock-input" placeholder="股票名称或代码，如：茅台 / 600519" autocomplete="off" spellcheck="false">
        <button id="search-btn" onclick="doSearch()">查询</button>
      </div>
      <div id="suggest" class="suggest hidden"></div>
      <div class="hint">数据来源：知乎公开讨论 · 情绪由 AI 自动分类 · 仅供参考</div>
    </div>
  </section>

  <!-- 详情视图 -->
  <section id="view-detail" class="view hidden">
    <a class="back" onclick="showSearch()">← 返回查询</a>

    <div class="card">
      <div class="stock-head" id="stock-head"></div>
    </div>

    <div class="card hidden" id="quote-card">
      <div class="section-title">实时行情</div>
      <div id="quote-body"></div>
      <div id="kline-chart"></div>
    </div>

    <div class="card">
      <div class="section-title">情绪面板</div>
      <div id="sentiment-body"><span style="color:var(--faint)">正在分析…</span></div>
    </div>

    <div class="card">
      <div class="section-title">AI 分析</div>
      <div id="analysis"></div><span id="cursor" class="blink"></span>
    </div>

    <div id="error-box" class="card hidden"><div class="err-box"></div></div>
  </section>

</main>

<footer>
  <div class="foot-links">
    <a href="https://github.com/ZZ2416" target="_blank" rel="noopener">GitHub 主页</a>
    <span class="dot">·</span>
    <span>创作者：zhangzhi</span>
    <span class="dot">·</span>
    <a href="https://github.com/ZZ2416/zhihuDP/issues" target="_blank" rel="noopener">联系与反馈</a>
  </div>
  <p>本工具仅整理展示知乎公开讨论信息，不构成任何投资建议。据此操作，风险自担。</p>
  <p>参考强度反映讨论情绪与数据的充分程度，不代表涨跌预测。</p>
</footer>

<script>
const $ = id => document.getElementById(id);

/* ===== 主题切换（localStorage + 系统偏好） ===== */
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  localStorage.setItem('zhihudp-theme', t);
  $('theme-btn').textContent = t === 'dark' ? '☀️' : '🌙';
}
function toggleTheme() {
  const cur = document.documentElement.getAttribute('data-theme');
  applyTheme(cur === 'dark' ? 'light' : 'dark');
}
(function initTheme() {
  const saved = localStorage.getItem('zhihudp-theme');
  const preferDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
  applyTheme(saved || (preferDark ? 'dark' : 'light'));
})();

/* ===== 视图切换 ===== */
function showDetail() {
  $('view-search').classList.add('hidden');
  $('view-detail').classList.remove('hidden');
  window.scrollTo({ top: 0 });
}
function showSearch() {
  $('view-detail').classList.add('hidden');
  $('view-search').classList.remove('hidden');
}

/* ===== 搜索联想（防抖调用 /api/resolve） ===== */
let suggestTimer = null;
$('stock-input').addEventListener('input', () => {
  const q = $('stock-input').value.trim();
  clearTimeout(suggestTimer);
  hideSuggest();
  if (q.length < 1) return;
  suggestTimer = setTimeout(async () => {
    try {
      const resp = await fetch('/api/resolve?q=' + encodeURIComponent(q));
      if (!resp.ok) return;
      const info = await resp.json();
      if (!info || !info.code) return;
      const box = $('suggest');
      box.classList.remove('hidden');
      box.innerHTML = '<div class="suggest-item" onclick="useSuggestion()">' +
        '<span class="name">' + esc(info.name) + '</span>' +
        '<span class="code">' + esc(info.code) + '</span>' +
        '<span class="market">' + esc(info.market) + '</span></div>';
      box._stock = info;
    } catch (e) { /* 忽略联想失败 */ }
  }, 300);
});
function hideSuggest() { $('suggest').classList.add('hidden'); }
function useSuggestion() {
  const info = $('suggest')._stock;
  if (!info) return;
  $('stock-input').value = info.name;
  hideSuggest();
  doSearch();
}

/* ===== 查询 ===== */
async function doSearch() {
  const stock = $('stock-input').value.trim();
  if (!stock) { $('stock-input').focus(); return; }
  const btn = $('search-btn');
  btn.disabled = true;
  hideSuggest();

  $('stock-head').innerHTML = '';
  $('quote-card').classList.add('hidden');
  $('quote-body').innerHTML = '';
  $('kline-chart').innerHTML = '';
  $('sentiment-body').innerHTML = '<span style="color:var(--faint)">正在分析…</span>';
  $('analysis').innerHTML = '';
  analysisText = '';
  hideError();
  $('cursor').classList.remove('hidden');
  showDetail();

  try {
    const resp = await fetch('/api/ask', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ stock })
    });
    if (!resp.ok) {
      const j = await resp.json().catch(() => ({}));
      showError(j.error || ('HTTP ' + resp.status));
      return;
    }
    await readSSE(resp, handleEvent);
    flushAnalysis(); // 收尾渲染
  } catch (e) {
    showError('网络异常：' + e.message);
  } finally {
    btn.disabled = false;
    $('cursor').classList.add('hidden');
  }
}

/* ===== SSE 解析 ===== */
async function readSSE(resp, handler) {
  const reader = resp.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    let idx;
    while ((idx = buffer.indexOf('\n\n')) >= 0) {
      const block = buffer.slice(0, idx);
      buffer = buffer.slice(idx + 2);
      let event = null, data = '';
      for (const line of block.split('\n')) {
        if (line.startsWith('event:')) event = line.slice(6).trim();
        else if (line.startsWith('data:')) data += line.slice(5).trim();
      }
      if (event) handler(event, data);
    }
  }
}

function handleEvent(event, data) {
  let d = {};
  try { d = data ? JSON.parse(data) : {}; } catch (e) {}
  switch (event) {
    case 'stock':
      $('stock-head').innerHTML =
        '<span class="name">' + esc(d.name || '') + '</span>' +
        '<span class="code">' + esc(d.code || '') + '</span>' +
        '<span class="market">' + esc(d.market || '') + '</span>' +
        '<span class="fresh">实时检索</span>';
      fetchKline(d.code, d.market); // 异步拉行情，不阻塞 SSE 流
      break;
    case 'sentiment': renderSentiment(d); break;
    case 'delta': appendDelta(d.text || ''); break;
    case 'error': showError(d.message || '发生错误'); break;
    case 'done': break;
  }
}

/* ===== 行情（报价 + 日K蜡烛图；异步拉取，不影响 SSE 流） ===== */
async function fetchKline(code, market) {
  try {
    const resp = await fetch('/api/kline?code=' + encodeURIComponent(code) +
      '&market=' + encodeURIComponent(market || '沪A') + '&days=60');
    if (!resp.ok) { renderKlineError(); return; }
    const data = await resp.json();
    if (!data || !data.quote) { renderKlineError(); return; }
    renderQuote(data.quote);
    renderKline(data.candles || []);
  } catch (e) { renderKlineError(); }
}

function renderQuote(q) {
  const up = (q.change || 0) >= 0;
  const color = up ? 'var(--bull)' : 'var(--bear)';
  const sign = up ? '+' : '';
  const vol = (q.volume || 0) >= 10000 ? (q.volume / 10000).toFixed(2) + '万手' : (q.volume || 0) + '手';
  $('quote-body').innerHTML =
    '<div class="q-row">' +
      '<div>' +
        '<span class="q-price" style="color:' + color + '">' + (q.price || 0).toFixed(2) + '</span>' +
        '<span class="q-change" style="color:' + color + '">' + sign + (q.change || 0).toFixed(2) + '  ' + sign + (q.change_pct || 0).toFixed(2) + '%</span>' +
      '</div>' +
      '<div class="q-grid">' +
        qCell('今开', (q.open || 0).toFixed(2)) +
        qCell('最高', (q.high || 0).toFixed(2)) +
        qCell('最低', (q.low || 0).toFixed(2)) +
        qCell('昨收', (q.prev_close || 0).toFixed(2)) +
        qCell('成交量', vol) +
      '</div>' +
    '</div>';
  $('quote-card').classList.remove('hidden');
}
function qCell(k, v) {
  return '<div class="q-cell"><div class="k">' + k + '</div><div class="v">' + v + '</div></div>';
}

function renderKline(candles) {
  const el = $('kline-chart');
  if (!candles || !candles.length) {
    el.innerHTML = '<div class="degraded" style="margin-top:12px">暂无行情数据</div>';
    return;
  }
  const n = candles.length;
  const W = 860, H = 340, padL = 58, padR = 12, padT = 18;
  const volH = 60, dateH = 26;
  const priceH = H - volH - dateH - padT;
  const plotW = W - padL - padR;
  const cw = plotW / n;
  const bodyW = Math.max(1, cw * 0.6);

  let min = Infinity, max = -Infinity, maxVol = 0;
  for (const c of candles) {
    if (c.low < min) min = c.low;
    if (c.high > max) max = c.high;
    if (c.volume > maxVol) maxVol = c.volume;
  }
  const pad = (max - min) * 0.05 || 1;
  min -= pad; max += pad;
  const y = v => padT + (max - v) / (max - min) * priceH;
  const x = i => padL + i * cw + cw / 2;
  const ma = k => {
    const pts = [];
    for (let i = k - 1; i < n; i++) {
      let s = 0;
      for (let j = i - k + 1; j <= i; j++) s += candles[j].close;
      pts.push(x(i).toFixed(1) + ',' + y(s / k).toFixed(1));
    }
    return pts.join(' ');
  };

  let svg = '';
  // 网格 + 价格刻度
  const gl = 4;
  for (let i = 0; i <= gl; i++) {
    const v = min + (max - min) * i / gl, yy = y(v);
    svg += '<line x1="' + padL + '" y1="' + yy + '" x2="' + (W - padR) + '" y2="' + yy + '" stroke="var(--border)" stroke-width="1"/>';
    svg += '<text x="' + (padL - 6) + '" y="' + (yy + 4) + '" text-anchor="end" font-size="10" fill="var(--faint)">' + v.toFixed(2) + '</text>';
  }
  // 蜡烛（红涨绿跌）
  for (let i = 0; i < n; i++) {
    const c = candles[i];
    const up = c.close >= c.open;
    const color = up ? 'var(--bull)' : 'var(--bear)';
    const cx = x(i);
    svg += '<line x1="' + cx + '" y1="' + y(c.high) + '" x2="' + cx + '" y2="' + y(c.low) + '" stroke="' + color + '" stroke-width="1"/>';
    const yo = y(c.open), yc = y(c.close);
    const top = Math.min(yo, yc), h = Math.max(1, Math.abs(yo - yc));
    svg += '<rect x="' + (cx - bodyW / 2) + '" y="' + top + '" width="' + bodyW + '" height="' + h + '" fill="' + color + '"/>';
  }
  // 均线 MA5/10/20
  svg += '<polyline points="' + ma(5) + '" fill="none" stroke="#f7b731" stroke-width="1.4"/>';
  svg += '<polyline points="' + ma(10) + '" fill="none" stroke="#3867d6" stroke-width="1.4"/>';
  svg += '<polyline points="' + ma(20) + '" fill="none" stroke="#8854d0" stroke-width="1.4"/>';
  // 成交量
  const volTop = H - dateH;
  svg += '<line x1="' + padL + '" y1="' + volTop + '" x2="' + (W - padR) + '" y2="' + volTop + '" stroke="var(--border)"/>';
  for (let i = 0; i < n; i++) {
    const c = candles[i];
    const up = c.close >= c.open;
    const color = up ? 'var(--bull)' : 'var(--bear)';
    const h = Math.max(1, c.volume / maxVol * volH);
    svg += '<rect x="' + (x(i) - bodyW / 2) + '" y="' + (volTop - h) + '" width="' + bodyW + '" height="' + h + '" fill="' + color + '" opacity="0.5"/>';
  }
  // 日期刻度
  const idxs = [0, Math.floor(n / 2), n - 1];
  for (const i of idxs) {
    svg += '<text x="' + x(i) + '" y="' + (H - 6) + '" text-anchor="middle" font-size="10" fill="var(--faint)">' + candles[i].date.slice(5) + '</text>';
  }
  // 图例
  svg += '<text x="' + (W - padR) + '" y="' + (padT + 10) + '" text-anchor="end" font-size="10" fill="var(--faint)">MA5 橙 · MA10 蓝 · MA20 紫</text>';

  el.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" style="width:100%;height:auto;display:block">' + svg + '</svg>';
}

function renderKlineError() {
  $('kline-chart').innerHTML = '<div class="degraded" style="margin-top:12px">行情数据加载失败，请稍后重试</div>';
}

/* ===== 情绪面板 ===== */
const sentiLabel = { bull: '看多', bear: '看空', neutral: '中性' };
const scoreClass = n => n <= 3 ? 'low' : (n <= 7 ? 'mid' : 'high');

function renderSentiment(s) {
  if (!s) return;
  let html = '';
  if (s.degraded) {
    html += '<div class="degraded">' + esc(s.err_msg || '数据不足，已降级展示') + '</div>';
  }
  html += '<div class="heat"><span class="num">' + (s.heat || 0) + '</span>' +
    '<span class="label">条近期讨论</span>' +
    '<span class="sample">样本 ' + (s.sample || 0) + ' 条</span></div>';

  const r = s.ratio || {};
  const pct = x => Math.round((x || 0) * 100) + '%';
  html += ratioRow('看多', 'bull', r.bull) + ratioRow('看空', 'bear', r.bear) + ratioRow('中性', 'neutral', r.neutral);

  if (s.score != null) {
    html += '<div class="score-box">' +
      '<span class="score-num ' + scoreClass(s.score) + '">' + s.score + '<small style="font-size:14px;color:var(--faint)">/10</small></span>' +
      '<span class="score-note">参考强度：反映当前讨论情绪与数据的充分程度，不代表涨跌预测。</span></div>';
  }

  const items = s.items || [];
  if (items.length) {
    html += '<div class="section-title" style="margin-top:18px">代表观点</div><div class="items">';
    for (const it of items) {
      html += '<div class="item">' +
        '<div class="title-line">' +
        '<a href="' + esc(it.url || '#') + '" target="_blank" rel="noopener">' + esc(it.title || '(无标题)') + '</a>' +
        '<span class="tag-sentiment ' + esc(it.sentiment || 'neutral') + '">' + esc(sentiLabel[it.sentiment] || '中性') + '</span>' +
        '</div>' +
        '<div class="meta"><span>✍️ ' + esc(it.author || '匿名') + '</span><span>👍 ' + (it.vote_up || 0) + '</span></div>' +
        '<div class="excerpt">' + esc(it.excerpt || '') + '</div>' +
        '</div>';
    }
    html += '</div>';
  }
  $('sentiment-body').innerHTML = html;
}

function ratioRow(label, cls, val) {
  const p = Math.round((val || 0) * 100);
  return '<div class="ratio-row"><span class="rlabel">' + label + '</span>' +
    '<div class="bar"><div class="' + cls + '" style="width:' + p + '%"></div></div>' +
    '<span class="rpct">' + p + '%</span></div>';
}

/* ===== AI 分析（markdown 轻渲染 + 防抖） ===== */
let analysisText = '';
let renderTimer = null;
function appendDelta(text) {
  analysisText += text;
  if (renderTimer) return;
  renderTimer = setTimeout(() => { renderTimer = null; $('analysis').innerHTML = renderMarkdown(analysisText); }, 80);
}
function flushAnalysis() {
  if (renderTimer) { clearTimeout(renderTimer); renderTimer = null; }
  $('analysis').innerHTML = renderMarkdown(analysisText);
}
function mdInline(s) {
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  return s;
}
function renderMarkdown(text) {
  let html = '', listOpen = false;
  const closeList = () => { if (listOpen) { html += '</ul>'; listOpen = false; } };
  for (const raw of text.split('\n')) {
    const line = raw.trim();
    if (!line) { closeList(); continue; }
    if (/^-{3,}/.test(line)) { closeList(); html += '<hr>'; continue; }
    let m = line.match(/^(#{1,4})\s+(.*)/);
    if (m) { closeList(); const lvl = m[1].length; html += '<h' + lvl + '>' + mdInline(m[2]) + '</h' + lvl + '>'; continue; }
    if (/^[-*•]\s+/.test(line)) { if (!listOpen) { html += '<ul>'; listOpen = true; } html += '<li>' + mdInline(line.replace(/^[-*•]\s+/, '')) + '</li>'; continue; }
    m = line.match(/^\d+[.、]\s+(.*)/);
    if (m) { if (!listOpen) { html += '<ul>'; listOpen = true; } html += '<li>' + mdInline(m[1]) + '</li>'; continue; }
    closeList();
    html += '<p>' + mdInline(line) + '</p>';
  }
  closeList();
  return html;
}

/* ===== 错误 ===== */
function showError(msg) {
  const box = $('error-box');
  box.classList.remove('hidden');
  box.querySelector('.err-box').innerHTML =
    '<strong>😥 出错了，请稍后重试。</strong>' +
    '<div class="detail">' + esc(msg || '未知错误') + '</div>';
}
function hideError() { $('error-box').classList.add('hidden'); }

/* ===== 工具 ===== */
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

$('stock-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') { hideSuggest(); doSearch(); }
});
window.addEventListener('load', () => $('stock-input').focus());
