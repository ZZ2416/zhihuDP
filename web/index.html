<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>知乎大盘 · 知乎股票情绪分析</title>
<link rel="icon" type="image/png" sizes="64x64" href="/favicon.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/css/style.css">
</head>
<body>

<header>
  <div class="logo">
    <img class="logo-whale" src="/pic/views/kanshan-v1.png" alt="看山">
    <span>知乎大盘</span>
  </div>
  <div class="header-right">
    <span class="tag">知乎股票情绪分析 · 信息工具</span>
    <button id="theme-btn" title="切换明暗主题" onclick="toggleTheme()">🌙</button>
  </div>
</header>

<main class="wrap">

  <!-- 终端行情条（ticker，首页加载热门股票） -->
  <div class="ticker-title">热门行情</div>
  <div class="ticker-bar" id="ticker-bar"></div>

  <div class="workspace">

    <!-- 主列 -->
    <div class="main-col">

      <!-- 搜索视图 -->
      <section id="view-search" class="view">
        <div class="hero">
          <img class="mascot" src="/pic/views/kanshan-v1.png" alt="看山" title="看山">
          <h2>看看知乎上大家在聊什么</h2>
          <p>输入股票名称或代码，查看价格走势、讨论情绪与 AI 解读</p>
        </div>
        <div class="card search-card">
          <div class="search">
            <input id="stock-input" placeholder="股票名称或代码，如：茅台 / 600519" autocomplete="off" spellcheck="false">
            <button id="search-btn" onclick="doSearch()">查询</button>
          </div>
          <div id="suggest" class="suggest hidden"></div>
          <div class="hint">数据来源：知乎公开讨论 · 行情与情绪仅供参考</div>
        </div>

        <!-- 热门股票（终端面板，辅助数据） -->
        <div class="card hot-card hidden" id="hot-stocks-card">
          <div class="section-title">热门股票<span id="hot-stocks-label" class="hot-label"></span>
            <a id="hot-stocks-back" class="hot-back hidden" onclick="backToHot()">← 返回热门</a></div>
          <div class="hot-stocks" id="hot-stocks"></div>
        </div>
      </section>

      <!-- 详情视图 -->
      <section id="view-detail" class="view hidden">
    <a class="back" onclick="showSearch()">← 返回查询</a>

    <div class="card">
      <div class="stock-head" id="stock-head"></div>
    </div>

    <div class="card hidden" id="quote-card">
      <div class="section-title">实时行情</div>
      <div id="quote-body"></div>
      <div id="kline-chart"></div>
    </div>

    <div class="card">
      <div class="section-title">情绪面板</div>
      <div id="sentiment-body"><span style="color:var(--faint)">正在分析…</span></div>
    </div>

    <div class="card">
      <div class="section-title">AI 分析</div>
      <div id="analysis"></div><span id="cursor" class="blink"></span>
    </div>

    <div class="card hidden" id="news-card">
      <div class="section-title">相关资讯</div>
      <div id="news-body"></div>
    </div>

    <div id="error-box" class="card hidden"><div class="err-box"></div></div>
  </section>

    </div><!-- /main-col -->

    <!-- 侧边栏：知乎热榜导航（主数据源）+ 热门板块 -->
    <aside class="side-col">
      <div class="card hot-card hidden" id="hot-sectors-card">
        <div class="section-title">热门板块</div>
        <div class="hot-chips" id="hot-sectors"></div>
      </div>
    </aside>

  </div><!-- /workspace -->

</main>

<footer>
  <div class="foot-links">
    <a href="https://github.com/ZZ2416" target="_blank" rel="noopener">GitHub 主页</a>
    <span class="dot">·</span>
    <span>创作者：zhangzhi</span>
    <span class="dot">·</span>
    <a href="https://github.com/ZZ2416/zhihuDP/issues" target="_blank" rel="noopener">联系与反馈</a>
  </div>
  <p>本工具仅整理展示知乎公开讨论信息，不构成任何投资建议。据此操作，风险自担。</p>
  <p>参考强度反映讨论情绪与数据的充分程度，不代表涨跌预测。</p>
</footer>

<script src="/js/util.js"></script>
<script src="/js/theme.js"></script>
<script src="/js/markdown.js"></script>
<script src="/js/api.js"></script>
<script src="/js/sse.js"></script>
<script src="/js/kline.js"></script>
<script src="/js/ui.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
